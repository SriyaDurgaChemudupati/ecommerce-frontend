<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Frontend</title>

    <link rel="stylesheet" href="styles/main.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">ShopEasy</div>

        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="header-right">
            <input type="text" placeholder="Search products..." class="search-bar">

            <div class="cart">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </div>

            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    
    <section class="hero">
    <div class="hero-content">
        <h1>Biggest Sale of the Year!</h1>
        <p>Discover amazing deals on your favorite products. Shop now and save big.</p>
        <a href="#products" class="cta-btn">Shop Now</a>
    </div>
</section>
<section id="products" class="products-section"></section>
    <h2>Featured Products</h2>

    <div id="product-grid" class="product-grid">
    <p id="loading">Loading products...</p>
</div>
</section>
<script src="scripts/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Target the element showing the counter and your add-to-cart buttons
    const cartCountElement = document.querySelector('.cart-count');
    
    // Target both the floating action button AND individual product card buttons
    const addToCartButtons = document.querySelectorAll('#add-cart, .product-card button, .product-details button');

    // 2. Initialize the item count based on what's currently in your HTML
    let currentCount = parseInt(cartCountElement.textContent) || 0;

    // 3. Listen for clicks on your add-to-cart elements
    addToCartButtons.forEach(button => {
        button.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Increment the internal tracker
            currentCount++;
            
            // Instantly update the DOM text without reloading the screen
            cartCountElement.textContent = currentCount;
            
            // Optional visual pop effect when an item is added
            cartCountElement.style.transform = 'scale(1.3)';
            setTimeout(() => {
                cartCountElement.style.transform = 'scale(1)';
            }, 200);
        });
    });
});
</script>
</body>
</html>
