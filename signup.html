<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - ShopEasy</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="auth-page">
        <form id="signup-form" class="auth-card">
            <h2>Create Account</h2>
            <p>Sign up to start shopping and save your details securely.</p>

            <div class="field-wrapper">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" placeholder="Enter your name" required>
                <div class="field-msg" id="name-msg"></div>
            </div>

            <div class="field-wrapper">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="Enter your email" required>
                <div class="field-msg" id="email-msg"></div>
            </div>

            <div class="field-wrapper">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password" required>

                <div class="password-meter">
                    <div id="password-strength-bar" class="password-strength-bar"></div>
                </div>

                <ul class="password-rules">
                    <li id="rule-length">At least 8 characters</li>
                    <li id="rule-lower">One lowercase letter</li>
                    <li id="rule-upper">One uppercase letter</li>
                    <li id="rule-number">One number</li>
                    <li id="rule-special">One special character</li>
                    <li id="rule-space">No spaces</li>
                </ul>

                <div class="field-msg" id="password-msg"></div>
            </div>

            <div class="field-wrapper">
                <label for="signup-confirm-password">Confirm Password</label>
                <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required>
                <div class="field-msg" id="confirm-msg"></div>
            </div>

            <button type="submit">Sign Up</button>
            <p id="signup-error" class="auth-error"></p>
        </form>
    </div>

    <script type="module" src="scripts/signup.js"></script>
</body>
</html>
