```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Sign Up</title>

    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="brand">
            ShopEasy
        </div>

        <p class="subtitle">
            Create Your Account 🚀
        </p>

        <h2>Sign Up</h2>

        <form id="signup-form">

            <div class="input-group">
                <label>Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('password')"
                    >
                        👁️
                    </button>

                </div>
            </div>

            <div class="input-group">

                <label>Confirm Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('confirm-password')"
                    >
                        👁️
                    </button>

                </div>

                <p id="match-error" class="error-message"></p>

            </div>

            <p id="password-strength"></p>

            <button
                type="submit"
                class="auth-btn"
            >
                Sign Up
            </button>

        </form>

        <div class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>

<script>
function togglePassword(id) {

    const field =
        document.getElementById(id);

    if (field.type === "password") {
        field.type = "text";
    } else {
        field.type = "password";
    }
}
</script>

<script type="module" src="scripts/signup.js"></script>

</body>
</html>
```
